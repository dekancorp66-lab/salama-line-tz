services:
  db:
    image: postgres:16-alpine
    container_name: salamaline-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: salamaline
      POSTGRES_USER: salamaline
      POSTGRES_PASSWORD: salamaline_dev_password
    ports:
      - "5432:5432"
    volumes:
      - salamaline_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salamaline -d salamaline"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  salamaline_pgdata:
